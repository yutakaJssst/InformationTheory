name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble publishable site
        run: |
          mkdir -p _site/slides
          cp .nojekyll _site/
          cp index.html _site/
          cp -R book-support _site/
          cp slides/deck.css _site/slides/
          # HTMLスライドは授業トップから参照するものを公開する。
          cp slides/0[0-7]_*_reveal.html _site/slides/
          # 書籍Webサポートから参照する第8・9・13回を含め、授業PDFを公開する。
          cp slides/0[0-7]_*.pdf _site/slides/
          cp slides/0[8-9]_*.pdf _site/slides/
          cp slides/1[0-3]_*.pdf _site/slides/
          # PPTX / Markdownソース / 補講ファイルは公開しない。
          echo "=== Published files ==="
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
