<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webサポートの移転 | 生成AI時代の検証可能な研究術</title>
  <link rel="canonical" href="https://yutakajssst.github.io/ai-research-book/">
  <style>
    body { margin: 0; background: #faf9f6; color: #252421; font-family: sans-serif; line-height: 1.8; }
    main { max-width: 42rem; margin: 12vh auto; padding: 0 1.5rem; }
    h1 { font-size: 1.5rem; font-family: serif; }
    a { color: #68492f; text-underline-offset: .2em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>『生成AI時代の検証可能な研究術』Webサポート</h1>
    <p>本専用のサイトへ移転しました。新しいページへ移動します。</p>
    <p>自動で移動しない場合は、<a id="new-site" href="https://yutakajssst.github.io/ai-research-book/">新しいWebサポート</a>を開いてください。</p>
  </main>
  <script>
    const destination = 'https://yutakajssst.github.io/ai-research-book/' + location.search + location.hash;
    document.getElementById('new-site').href = destination;
    location.replace(destination);
  </script>
</body>
</html>
